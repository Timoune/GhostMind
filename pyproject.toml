[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostmind"
version = "4.5.0"
description = "GhostMind - Autonomous cognitive reasoning engine for Mini Von"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Timoune", email = "your@email.com"}
]
keywords = ["ai", "agent", "cognitive", "llm", "autonomous", "reasoning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "structlog>=24.0",
    "psutil>=5.9",
    "aiohttp>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "customtkinter>=5.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cognition*", "core*", "llm*", "memory*", "orchestration*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"
